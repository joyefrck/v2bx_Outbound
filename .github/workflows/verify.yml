name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookworm-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Recover expired sources and install Debian 12 dependencies on AMD64
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" -w /workspace \
            python:3.10-slim-bookworm bash tests/runtime_bookworm_dependencies.sh
  bullseye-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install real Debian 11 dependencies on AMD64
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" -w /workspace \
            python:3.10-slim-bullseye bash tests/runtime_bullseye_dependencies.sh
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq curl
      - name: Check scripts and release files
        run: |
          bash -n install.sh
          bash -n build.sh
          bash -n src/helper.sh
          for file in src/manager/*.sh; do bash -n "$file"; done
          bash -n v2bx-manager.sh
          bash -n v2bx-socks.sh
          bash build.sh
          git diff --exit-code -- v2bx-socks.sh v2bx-manager.sh SHA256SUMS LICENSE.MPL-2.0
          sha256sum --check SHA256SUMS
          bash install.sh --help
          bash v2bx-socks.sh --help
          bash v2bx-manager.sh --help
      - name: Test routing, rollback, terminal and installer
        run: python3 -m unittest discover -s tests -v
      - name: Verify detached worker with real systemd and simulated SSH hangup
        run: sudo env V2BX_SYSTEMD_TEST=1 python3 -m unittest discover -s tests -p test_jobs.py -v
